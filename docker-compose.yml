services:
  mundo3d-app:
    container_name: mundo-3d-app
    build:
      context: .
      dockerfile: Dockerfile
    image: mundo-3d-app:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    expose:
      - "3000"
    networks:
      - internal

  nginx:
    image: nginx:latest
    container_name: mundo-3d-nginx
    restart: unless-stopped
    depends_on:
      - mundo3d-app
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    networks:
      - internal
      - proxy

networks:
  internal:
    driver: bridge
  proxy:
    external: true
